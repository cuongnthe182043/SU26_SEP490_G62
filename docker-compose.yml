version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # Toàn hệ thống chạy giờ Việt Nam (+07). Postgres mặc định UTC nên NOW(),
    # CURRENT_DATE, ::date và EXTRACT(MONTH FROM ...) đều lệch 7 tiếng — từ 0h đến
    # 7h sáng giờ VN server vẫn coi là "hôm qua", làm sai mốc tháng của KPI/lương và
    # sai khớp ngày lễ. TIMESTAMPTZ lưu UTC bên trong nên đổi múi giờ KHÔNG đụng dữ liệu,
    # chỉ đổi cách quy đổi ra ngày.
    command: postgres -c timezone=Asia/Ho_Chi_Minh
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-SEP490}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
      - './DB script/DB script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro'
      - './DB script/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro'
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d SEP490" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9999:9999"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      # new Date() trong Node phải chạy giờ VN, nếu không getDate()/getMonth() lệch
      # 7 tiếng: quy tắc "chỉ ứng lương ngày 25" và mốc tháng của KPI sẽ sai vào
      # khoảng 0h-7h sáng.
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-SEP490}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DB_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9999}
        VITE_GG_CLIENT_ID: ${VITE_GG_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
